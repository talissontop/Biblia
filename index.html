<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia de Estudo 3D - Originais</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-dark: #0f1117;
            --panel-bg: rgba(22, 26, 36, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-gold: #d4af37;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --sidebar-width: 280px;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body { font-family: var(--font-main); background-color: var(--bg-dark); color: var(--text-primary); overflow: hidden; height: 100vh; width: 100vw; position: relative; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background-color: #0f1117; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; }
        
        /* HEADER E MENU LATERAL */
        .app-header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: var(--panel-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .menu-toggle-btn { background: transparent; border: 1px solid var(--panel-border); color: var(--accent-gold); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.2s ease; }
        .app-title { font-size: 18px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
        .app-title span { color: var(--accent-gold); font-size: 12px; border: 1px solid var(--accent-gold); padding: 2px 6px; border-radius: 4px; }
        
        .sidebar { position: absolute; top: 60px; left: -280px; width: var(--sidebar-width); height: calc(100vh - 60px); background: var(--panel-bg); backdrop-filter: blur(16px); border-right: 1px solid var(--panel-border); z-index: 20; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-nav { list-style: none; padding: 20px 0; }
        .nav-item a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--text-secondary); text-decoration: none; font-size: 15px; }
        .nav-item a:hover, .nav-item.active a { color: var(--accent-gold); background: rgba(212, 175, 55, 0.08); border-left: 4px solid var(--accent-gold); }

        /* PAINEL CENTRAL DE LEITURA (NOVO) */
        .leitor-panel { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 800px; height: calc(100vh - 120px); background: rgba(15, 17, 23, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--panel-border); border-radius: 12px; z-index: 15; padding: 30px; overflow-y: auto; transition: opacity 0.3s ease; }
        .leitor-panel.hidden { opacity: 0; pointer-events: none; }
        
        .versiculo-box { margin-bottom: 25px; line-height: 1.7; }
        .versiculo-texto { font-size: 18px; color: #fff; }
        .versiculo-texto .num { color: var(--accent-gold); font-weight: bold; margin-right: 8px; font-size: 14px; }
        
        .estudo-box { margin-top: 10px; padding: 15px; background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--accent-gold); border-radius: 0 6px 6px 0; font-size: 14.5px; color: #cbd5e1; }
        .estudo-box strong { color: var(--accent-gold); }

        /* SCROLLBAR PERSONALIZADA */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }
    </style>
</head>
<body>
    
    <div id="canvas-container">
        <canvas id="renderCanvas"></canvas>
    </div>

    <header class="app-header">
        <button class="menu-toggle-btn" id="menuToggle">☰ Menu</button>
        <h1 class="app-title">Bíblia de Estudo <span>3D</span></h1>
    </header>
    
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-nav">
            <li class="nav-item active"><a href="#" id="btn-leitor">📖 Leitor Bíblico</a></li>
            <li class="nav-item"><a href="#" id="btn-explorador">🏛️ Explorador 3D</a></li>
        </ul>
    </aside>

    <!-- PAINEL ONDE APARECERÃO OS VERSÍCULOS E ESTUDOS -->
    <main class="leitor-panel" id="leitor-panel">
        <h2 id="titulo-livro" style="color: var(--accent-gold); margin-bottom: 20px; text-align: center;">Carregando...</h2>
        <div id="texto-biblico"></div>
    </main>

    <!-- SCRIPTS -->
    <script src="js/engine3d/scene.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/core/app.js"></script>
</body>
</html>
