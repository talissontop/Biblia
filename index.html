<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia e Jogo de Estudo 3D</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div id="app-container">
        <!-- Barra de Perfil Superior -->
        <div id="profile-container"></div>

        <!-- Menu Principal / Navegação -->
        <main>
            <div id="menu-principal" class="tela ativa">
                <div class="grid-botoes">
                    <button class="btn-livro" onclick="abrirSeletorLivros()">Ler Bíblia</button>
                </div>
            </div>

            <!-- Demais telas do app -->
            <div id="tela-leitura" class="tela">
                <button id="btn-voltar-leitura" onclick="voltarMenu()">Voltar</button>
                <h2 id="titulo-leitura"></h2>
                <div id="texto-biblico"></div>
                <div id="botoes-navegacao-inferior"></div>
            </div>
        </main>
    </div>

    <script src="./profile.js"></script>
    <script src="./js/core/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
