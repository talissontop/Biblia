<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia 3D</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* Garante que o sistema de telas do seu app.js funcione perfeitamente */
        .view-hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Barra de Perfil -->
        <div id="profile-container"></div>

        <main>
            <!-- TELA 1: LIVROS (Menu Principal direto na Bíblia) -->
            <div id="tela-livros">
                <h2>Velho Testamento</h2>
                <div id="grid-vt" class="grid-botoes"></div>
                
                <h2>Novo Testamento</h2>
                <div id="grid-nt" class="grid-botoes"></div>
            </div>

            <!-- TELA 2: CAPÍTULOS -->
            <div id="tela-capitulos" class="view-hidden">
                <button class="btn-voltar" onclick="mostrarTela('livros')">Voltar aos Livros</button>
                <h2 id="titulo-livro-selecionado"></h2>
                <div id="grid-capitulos-container" class="grid-botoes"></div>
            </div>

            <!-- TELA 3: LEITURA -->
            <div id="tela-leitura" class="view-hidden">
                <button id="btn-voltar-leitura" class="btn-voltar">Voltar</button>
                <h2 id="titulo-leitura"></h2>
                
                <div id="leitor-panel" class="painel-rolagem">
                    <div id="texto-biblico"></div>
                </div>
                
                <div id="botoes-navegacao-inferior" style="display: none; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="btn-prev" class="btn-voltar" onclick="navegar(-1)">Anterior</button>
                    <button id="btn-next" class="btn-voltar" onclick="navegar(1)">Próximo</button>
                </div>
            </div>

            <!-- TELAS OCULTAS (Para o seu JS não dar erro ao tentar escondê-las) -->
            <div id="tela-harpa" class="view-hidden"><div id="grid-hinos"></div></div>
            <div id="tela-atualizacoes" class="view-hidden"></div>
        </main>
    </div>

    <script src="./profile.js"></script>
    <script src="./js/core/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
