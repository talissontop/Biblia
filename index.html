<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia 3D</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        main { padding: 20px; text-align: center; }
        h2 { color: #d4af37; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; }
        .grid-botoes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(145deg, #1f242c, #161b22);
            color: #d4af37;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        button:hover { background: #d4af37; color: #0d1117; }
        .btn-voltar { background: #21262d; color: #c9d1d9; width: 100%; max-width: 200px; margin: 0 auto 20px auto; display: block; }
        
        /* Compatibilidade total com o sistema de hidden do seu app.js */
        .view-hidden { display: none !important; }
        
        #leitor-panel { background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; max-height: 70vh; overflow-y: auto; text-align: left; }
        .versiculo-box { margin-bottom: 12px; font-size: 1.1em; line-height: 1.6; }
        .num { color: #d4af37; font-weight: bold; margin-right: 8px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="profile-container"></div>

    <main>
        <!-- TELA 1: MENU PRINCIPAL -->
        <div id="tela-menu">
            <h2>Bem-vindo à Bíblia 3D</h2>
            <div class="grid-botoes" style="grid-template-columns: 1fr; max-width: 250px; margin: 0 auto;">
                <button style="padding: 20px; font-size: 1.2em;" onclick="abrirBiblia()">📖 Ler Bíblia</button>
            </div>
        </div>

        <!-- TELA 2: LIVROS -->
        <div id="tela-livros" class="view-hidden">
            <button class="btn-voltar" onclick="voltarParaMenu()">⬅ Voltar ao Menu</button>
            <h2>Velho Testamento</h2>
            <div id="grid-vt" class="grid-botoes"></div>
            <h2>Novo Testamento</h2>
            <div id="grid-nt" class="grid-botoes"></div>
        </div>

        <!-- TELA 3: CAPÍTULOS -->
        <div id="tela-capitulos" class="view-hidden">
            <button class="btn-voltar" onclick="mostrarTela('livros')">⬅ Voltar aos Livros</button>
            <h2 id="titulo-livro-selecionado"></h2>
            <div id="grid-capitulos-container" class="grid-botoes"></div>
        </div>

        <!-- TELA 4: LEITURA DE VERSÍCULOS -->
        <div id="tela-leitura" class="view-hidden">
            <button id="btn-voltar-leitura" class="btn-voltar">⬅ Voltar</button>
            <h2 id="titulo-leitura"></h2>
            <div id="leitor-panel">
                <div id="texto-biblico"></div>
            </div>
            <div id="botoes-navegacao-inferior" style="display: none; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="btn-prev" class="btn-voltar" onclick="navegar(-1)">Anterior</button>
                <button id="btn-next" class="btn-voltar" onclick="navegar(1)">Próximo</button>
            </div>
        </div>

        <div id="tela-harpa" class="view-hidden"></div>
        <div id="tela-atualizacoes" class="view-hidden"></div>
    </main>

    <script src="./profile.js"></script>
    <script src="./js/core/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

        function abrirBiblia() {
            document.getElementById('tela-menu').classList.add('view-hidden');
            document.getElementById('tela-livros').classList.remove('view-hidden');
        }
        function voltarParaMenu() {
            document.getElementById('tela-livros').classList.add('view-hidden');
            document.getElementById('tela-menu').classList.remove('view-hidden');
        }
    </script>
</body>
</html>
